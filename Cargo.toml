[package]
name = "derive-getters"
version = "0.3.0"
authors = ["Stephan Luther <stephan@kvsari.org>"]
license = "MIT"
description = "Simple boilerplate getters generator."
repository = "https://git.sr.ht/~kvsari/derive-getters"
keywords = ["getter", "getters", "derive", "macro"]
categories = ["development-tools::procedural-macro-helpers"]
edition = "2021"
autotests = false
readme = "README.md"

[lib]
name = "derive_getters"
proc-macro = true

[[test]]
name = "tests"
path = "tests/lib.rs"

[dependencies]
quote = "1.0.35"
syn = { version = "2.0.52", features = ["extra-traits"] }
proc-macro2 = "1.0.78"

[dev-dependencies]
trybuild = "1.0.89"
serde = { version = "1.0.197", features = ["derive"] }
version-sync = "0.9.5"
